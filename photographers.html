<script>
(function(){
  var phImgs=document.querySelectorAll('.ph img'),tick=false;
  function raf(){
    tick=false;
    var v=innerHeight,mid=v/2;
    phImgs.forEach(function(img){
      var r=img.parentElement.getBoundingClientRect();
      var p=Math.max(-1,Math.min(1,(mid-(r.top+r.height/2))/(v/2+r.height/2)));
      img.style.setProperty('--py',(p*10)+'%');
    });
  }
  function onscroll(){if(tick)return;tick=true;requestAnimationFrame(raf)}
  addEventListener('scroll',onscroll,{passive:true});
  addEventListener('resize',onscroll);
  raf();
})();
</script>
